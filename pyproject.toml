[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-studiolight"
description = "Three-point studio lighting rig with depth-based camera-space shadow raymarching, sampled area emitters, and Kelvin control for FLUX in ComfyUI."
version = "1.0.0"
authors = [
    { name = "Maciej Tajber", email = "maciej@tajber.pl" }
]
license = { text = "MIT" }
# PyTorch (torch>=2.0.0) is provided by the host ComfyUI environment.
dependencies = ["numpy>=1.24.0", "Pillow>=9.5.0"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/maciejtajber/ComfyUI-StudioLight"
Homepage = "https://github.com/maciejtajber/ComfyUI-StudioLight"

[tool.comfy]
PublisherId = "maciejtajber"
DisplayName = "ComfyUI-StudioLight"

[tool.setuptools]
packages = ["comfyui_studiolight", "comfyui_studiolight.nodes"]
include-package-data = true

[tool.setuptools.package-dir]
comfyui_studiolight = "."

[tool.setuptools.package-data]
comfyui_studiolight = ["web/*.js", "presets/*.json", "workflows/*.json", "docs/*.md"]
