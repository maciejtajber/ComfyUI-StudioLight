<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Matte Dark Chamber -->
    <radialGradient id="chamberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111114" />
      <stop offset="70%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>

    <!-- Chrome Sphere Gradient -->
    <linearGradient id="chromeMini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a1a1aa" />
      <stop offset="70%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Soft Orange Key Light Sector -->
    <radialGradient id="keySector" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ff7800" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ff7800" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff7800" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes sweepAngle {
      0% { transform: rotate(-60deg); }
      50% { transform: rotate(45deg); }
      100% { transform: rotate(-60deg); }
    }
    .key-arm-animated {
      transform-origin: 300px 300px;
      animation: sweepAngle 10s ease-in-out infinite;
    }
  </style>

  <!-- Base Plate (Machined Camera Dial Housing) -->
  <rect width="600" height="600" fill="url(#chamberBg)" rx="8" />
  <rect x="8" y="8" width="584" height="584" fill="none" stroke="#1f1f23" stroke-width="1.5" rx="6" />

  <!-- Outer Knurled Ring -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="#18181b" stroke-width="6" stroke-dasharray="2,4" />
  <circle cx="300" cy="300" r="250" fill="none" stroke="#27272a" stroke-width="1.2" />

  <!-- Concentric Distance Scales (Meters) -->
  <circle cx="300" cy="300" r="200" fill="none" stroke="#18181b" stroke-width="1" stroke-dasharray="4,4" />
  <circle cx="300" cy="300" r="140" fill="none" stroke="#1f1f23" stroke-width="1" />
  <circle cx="300" cy="300" r="80" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Distance Markings in White Enamel -->
  <text x="306" y="225" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#52525b">1.0m</text>
  <text x="306" y="165" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#52525b">2.0m</text>
  <text x="306" y="105" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#52525b">3.0m</text>

  <!-- Crosshairs & Degree Indices -->
  <line x1="50" y1="300" x2="550" y2="300" stroke="#1f1f23" stroke-width="1" />
  <line x1="300" y1="50" x2="300" y2="550" stroke="#1f1f23" stroke-width="1" />

  <!-- Degree Ticks & Labels -->
  <text x="300" y="42" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#71717a" text-anchor="middle">0&#176;</text>
  <text x="565" y="303" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#71717a" text-anchor="middle">+90&#176;</text>
  <text x="35" y="303" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#71717a" text-anchor="middle">-90&#176;</text>
  <text x="300" y="575" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#71717a" text-anchor="middle">&#177;180&#176;</text>

  <!-- CAMERA POSITION AT BOTTOM (Focal Plane) -->
  <g transform="translate(300, 520)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#71717a" stroke-width="1.2" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#71717a" stroke-width="1.2" />
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#a1a1aa" text-anchor="middle">CAMERA (40mm)</text>
  </g>

  <!-- STATIC FILL LIGHT FIXTURE (+45° / White) -->
  <g transform="translate(300, 300) rotate(45)">
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="0" cy="-180" r="6" fill="#ffffff" />
    <circle cx="0" cy="-180" r="2" fill="#000000" />
    <g transform="translate(0, -180) rotate(-45)">
      <rect x="10" y="-12" width="100" height="22" fill="#0d0d10" stroke="#ffffff" stroke-width="1" rx="2" />
      <text x="60" y="3" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">FILL +45&#176;</text>
    </g>
  </g>

  <!-- STATIC RIM LIGHT FIXTURE (-135° / Red) -->
  <g transform="translate(300, 300) rotate(-135)">
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="0" cy="-140" r="6" fill="#ef4444" />
    <circle cx="0" cy="-140" r="2" fill="#ffffff" />
    <g transform="translate(0, -140) rotate(135)">
      <rect x="-110" y="-12" width="100" height="22" fill="#0d0d10" stroke="#ef4444" stroke-width="1" rx="2" />
      <text x="-60" y="3" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ef4444" text-anchor="middle">RIM -135&#176;</text>
    </g>
  </g>

  <!-- DYNAMIC ANIMATED KEY LIGHT FIXTURE (Orange #ff7800) -->
  <g class="key-arm-animated">
    <!-- Soft Conical Beam -->
    <polygon points="300,300 240,110 360,110" fill="url(#keySector)" />
    <line x1="300" y1="300" x2="300" y2="-110" stroke="#ff7800" stroke-width="2.5" />
    <circle cx="300" cy="110" r="8" fill="#ff7800" />
    <circle cx="300" cy="110" r="3" fill="#ffffff" />
    <!-- Dynamic Fixture Badge -->
    <g transform="translate(315, 98)">
      <rect x="0" y="0" width="120" height="24" fill="#18181b" stroke="#ff7800" stroke-width="1" rx="2" />
      <text x="60" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ff7800" text-anchor="middle">KEY: 5500K</text>
    </g>
  </g>

  <!-- CENTRAL SUBJECT: SPLIT VFX CALIBRATION BALL (18% Grey / Chrome) -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="32" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- 18% Grey Hemisphere -->
    <path d="M 0 -30 A 30 30 0 0 0 0 30 Z" fill="#71717a" />
    <!-- Polished Chrome Hemisphere -->
    <path d="M 0 -30 A 30 30 0 0 1 0 30 Z" fill="url(#chromeMini)" />
    <!-- Split Divider -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#18181b" stroke-width="1.2" />
    <!-- Specular Highlight -->
    <circle cx="12" cy="-14" r="2.5" fill="#ffffff" />
    <text x="0" y="-40" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SUBJECT</text>
  </g>

  <!-- TOP HEADER TELEMETRY -->
  <g transform="translate(30, 36)">
    <circle cx="6" cy="6" r="4" fill="#22c55e" />
    <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="2">PHOTOMETRIC STUDIO GIZMO</text>
  </g>

  <!-- BOTTOM FOOTER TELEMETRY -->
  <g transform="translate(30, 570)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#52525b" letter-spacing="2">CAMERA-SPACE PHOTOMETRY // 18% GREY &amp; CHROME REFERENCE</text>
  </g>
</svg>