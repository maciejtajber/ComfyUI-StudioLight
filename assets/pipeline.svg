<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709" />
      <stop offset="50%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2234" />
      <stop offset="100%" stop-color="#0d1320" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131620" stroke-width="0.7" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Substrate -->
  <rect width="1600" height="620" fill="url(#pipeBg)" />
  <rect width="1600" height="620" fill="url(#grid)" opacity="0.8" />
  <rect x="20" y="20" width="1560" height="580" fill="none" stroke="#1f2538" stroke-width="1" />

  <!-- Corner Ticks -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 1580 40 L 1580 20 L 1560 20" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 20 580 L 20 600 L 40 600" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 1580 580 L 1580 600 L 1560 600" fill="none" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Header Banner -->
  <g transform="translate(50, 48)">
    <rect x="0" y="0" width="7" height="7" fill="#f59e0b" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="3">STUDIOLIGHT ARCHITECTURE</text>
    <text x="250" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569" letter-spacing="1">| 2-STAGE GEOMETRY &amp; RELIGHTING PIPELINE</text>
  </g>

  <!-- FLOW CONNECTIONS (BUS WIRES) -->
  <g fill="none" stroke-width="1.8">
    <!-- Prompt split to Pass 1 -->
    <path d="M 240 180 L 285 180" stroke="#f59e0b" marker-end="url(#arrowAmber)" />
    <!-- Prompt split to Pass 2 (Bypass bus along bottom) -->
    <path d="M 140 240 L 140 520 L 1180 520 L 1180 435" stroke="#f59e0b" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />

    <!-- Pass 1 to 3D Extraction -->
    <path d="M 485 180 L 535 180" stroke="#38bdf8" marker-end="url(#arrow)" />

    <!-- 3D Extraction to StudioLightRig -->
    <path d="M 735 180 L 785 180" stroke="#38bdf8" marker-end="url(#arrow)" />

    <!-- StudioLightRig to Photometric Composite (Dual Split: relighting_map & specular_pass) -->
    <path d="M 985 160 L 1035 160" stroke="#38bdf8" marker-end="url(#arrow)" />
    <path d="M 985 200 L 1035 200" stroke="#e879f9" marker-end="url(#arrow)" />

    <!-- Photometric Composite to SIShadowHighlight -->
    <path d="M 1165 315 L 1165 345" stroke="#38bdf8" marker-end="url(#arrow)" />

    <!-- SIShadowHighlight to Pass 2 KSampler -->
    <path d="M 1265 385 L 1295 385" stroke="#38bdf8" marker-end="url(#arrow)" />

    <!-- Pass 2 to Master Output -->
    <path d="M 1455 385 L 1495 385" stroke="#10b981" marker-end="url(#arrowGreen)" />
  </g>

  <!-- PIPELINE STAGES BLOCKS -->

  <!-- 1. INPUT: MASTER PROMPT & ALBEDO DECOUPLING -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="190" height="160" rx="4" fill="url(#cardGrad)" stroke="#232a3d" stroke-width="1.2" />
    <rect x="0" y="0" width="190" height="26" fill="#151a26" rx="4" />
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="1">STAGE 01 // INPUTS</text>

    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Master User Prompt</text>
    <text x="12" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Subject, style, anatomy</text>

    <line x1="12" y1="82" x2="178" y2="82" stroke="#1f2638" stroke-width="1" />

    <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">Neutral Albedo Suffix</text>
    <text x="12" y="120" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">"flat diffuse ambient,</text>
    <text x="12" y="132" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">shadowless, albedo"</text>
    <text x="12" y="148" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">✓ Prevents pre-baked spec</text>
  </g>

  <!-- 2. PASS 1 DRAFT (STEPS 0-10) -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="195" height="160" rx="4" fill="url(#cardGrad)" stroke="#232a3d" stroke-width="1.2" />
    <rect x="0" y="0" width="195" height="26" fill="#151a26" rx="4" />
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">PASS 1 // DRAFT</text>

    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Geometry Crystallization</text>
    <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">KSampler: Steps 0 → 10</text>
    <text x="12" y="85" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Empty Latent Initializer</text>

    <rect x="12" y="100" width="171" height="46" fill="#0d111a" stroke="#1f273b" stroke-width="1" />
    <text x="20" y="117" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e2e8f0">• Anatomy &amp; pose locked</text>
    <text x="20" y="131" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e2e8f0">• Garment structure set</text>
    <text x="20" y="142" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">✓ Zero directional shadows</text>
  </g>

  <!-- 3. 3D STRUCTURAL EXTRACTION -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="195" height="160" rx="4" fill="url(#cardGrad)" stroke="#232a3d" stroke-width="1.2" />
    <rect x="0" y="0" width="195" height="26" fill="#151a26" rx="4" />
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1">STAGE 02 // 3D SENSORS</text>

    <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Structural Extraction</text>

    <rect x="12" y="68" width="171" height="36" fill="#0d111a" stroke="#252d40" stroke-width="1" />
    <text x="20" y="83" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#e879f9">DSINE Surface Normals</text>
    <text x="20" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Camera-space curvature</text>

    <rect x="12" y="110" width="171" height="36" fill="#0d111a" stroke="#252d40" stroke-width="1" />
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">Depth Anything V2</text>
    <text x="20" y="138" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Metric Z-depth map</text>
  </g>

  <!-- 4. STUDIOLIGHTRIG (3-POINT CONSOLE) -->
  <g transform="translate(790, 80)">
    <rect x="0" y="0" width="195" height="200" rx="4" fill="url(#activeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <rect x="0" y="0" width="195" height="28" fill="#172235" rx="4" />
    <text x="12" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">StudioLightRig</text>

    <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">3D Camera-Space Placement</text>
    <text x="12" y="64" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">40° Portrait FOV Unprojection</text>

    <rect x="12" y="74" width="171" height="74" fill="#0c1018" stroke="#1e273b" stroke-width="1" />
    <text x="18" y="90" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fcd34d">• Key, Fill, Rim C-Stands</text>
    <text x="18" y="103" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#bae6fd">• PCSS 8-Tap Soft Shadows</text>
    <text x="18" y="116" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f5d0fe">• Physical Modifier Apertures</text>
    <text x="18" y="129" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">• 1/d¹·⁶ Calibrated Falloff</text>
    <text x="18" y="141" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#cbd5e1">• Blackbody Kelvin Curves</text>

    <!-- Out ports callout -->
    <text x="12" y="166" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">OUT: relighting_map (32-bit)</text>
    <text x="12" y="180" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e879f9">OUT: specular_pass (Blinn)</text>
    <text x="12" y="194" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f59e0b">OUT: lighting_prompt (Sync)</text>
  </g>

  <!-- 5. PHOTOMETRIC COMPOSITE -->
  <g transform="translate(1040, 115)">
    <rect x="0" y="0" width="245" height="195" rx="4" fill="url(#cardGrad)" stroke="#232a3d" stroke-width="1.2" />
    <rect x="0" y="0" width="245" height="26" fill="#151a26" rx="4" />
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#e2e8f0" letter-spacing="1">Photometric Composite</text>

    <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Scene-Referred Linear Math</text>

    <rect x="12" y="64" width="221" height="85" fill="#0d111a" stroke="#1f273b" stroke-width="1" />
    <text x="20" y="82" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">• Rec.709 Linear Light Space</text>
    <text x="20" y="97" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#cbd5e1">• Rational Shoulder Tonemapper</text>
    <text x="20" y="112" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#cbd5e1">• Headroom Control (White Point)</text>
    <text x="20" y="127" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#cbd5e1">• Isolated 2.8% Specular Lobe</text>
    <text x="20" y="141" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">✓ Prevents harsh color clipping</text>

    <text x="12" y="172" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">EMITS: Lit Proxy Plate (HDR Linear)</text>
  </g>

  <!-- 6. SI SHADOW & HIGHLIGHT (DARKROOM SCULPTOR) -->
  <g transform="translate(1040, 350)">
    <rect x="0" y="0" width="220" height="120" rx="4" fill="url(#cardGrad)" stroke="#232a3d" stroke-width="1.2" />
    <rect x="0" y="0" width="220" height="24" fill="#151a26" rx="4" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f59e0b" letter-spacing="1">SIShadowHighlight</text>

    <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Tonal Darkroom Sculptor</text>
    <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">• Shadow Crush / Highlight Beacon</text>
    <text x="12" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">• Hermite C¹ Smoothstep Curves</text>
    <text x="12" y="90" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">• Acts as Physical Illumination Volume</text>
    <text x="12" y="105" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">✓ VAE Encode to Latent Space</text>
  </g>

  <!-- 7. PASS 2 KSampler (STOCHASTIC INTEGRATION) -->
  <g transform="translate(1300, 315)">
    <rect x="0" y="0" width="155" height="155" rx="4" fill="url(#activeGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
    <rect x="0" y="0" width="155" height="26" fill="#13241b" rx="4" />
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#10b981" letter-spacing="1">PASS 2 // POLISH</text>

    <text x="10" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">KSampler Polish</text>
    <text x="10" y="64" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">Steps: 10 → 30</text>
    <text x="10" y="78" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f59e0b">Denoise: 0.55</text>

    <rect x="8" y="88" width="139" height="58" fill="#0b130e" stroke="#1d3826" stroke-width="1" />
    <text x="12" y="103" font-family="'JetBrains Mono', monospace" font-size="7.8" fill="#e2e8f0">• Subsurface Skin (SSS)</text>
    <text x="12" y="115" font-family="'JetBrains Mono', monospace" font-size="7.8" fill="#e2e8f0">• Dielectric Catchlights</text>
    <text x="12" y="127" font-family="'JetBrains Mono', monospace" font-size="7.8" fill="#e2e8f0">• Contact Shadows</text>
    <text x="12" y="139" font-family="'JetBrains Mono', monospace" font-size="7.8" fill="#86efac">✓ Zero Geometry Drift</text>
  </g>

  <!-- 8. FINAL MASTER RENDER -->
  <g transform="translate(1500, 345)">
    <rect x="0" y="0" width="70" height="85" rx="4" fill="#0d1c14" stroke="#10b981" stroke-width="2" />
    <text x="35" y="32" font-size="22" text-anchor="middle">💎</text>
    <text x="35" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10b981" text-anchor="middle">MASTER</text>
    <text x="35" y="68" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a7f3d0" text-anchor="middle">RENDER</text>
  </g>

  <!-- Bottom Blueprint Dimension Line -->
  <g transform="translate(50, 575)" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#475569">
    <line x1="0" y1="0" x2="1500" y2="0" stroke="#1e2538" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#f59e0b" />
    <circle cx="485" cy="0" r="2.5" fill="#38bdf8" />
    <circle cx="985" cy="0" r="2.5" fill="#c084fc" />
    <circle cx="1500" cy="0" r="2.5" fill="#10b981" />
    <text x="120" y="16">PHASE I: UNLIT CARRIER EXTRACTION (STEPS 0-10)</text>
    <text x="620" y="16">PHASE II: PHOTOMETRIC DEFERRED SHADING</text>
    <text x="1150" y="16">PHASE III: STOCHASTIC REDIFFUSION (STEPS 10-30)</text>
  </g>
</svg>
