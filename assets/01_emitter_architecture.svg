<text x="270" y="153">Single-layer penumbra</text>
<text x="270" y="173">• Binary blocker test</text>
<text x="270" y="193">  per sample point</text>
<text x="270" y="213">• Average across S</text>
<text x="270" y="233">  yields true penumbra</text>

<!-- 3. SPECULAR REFLECTION BOX -->
<rect x="490" y="107" width="225" height="148" />
<text x="505" y="131" class="b">SPECULAR REFLECTION</text>
<text x="505" y="153">Ray-plane intersection</text>
