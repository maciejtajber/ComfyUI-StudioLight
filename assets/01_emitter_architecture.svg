<!-- 1. DIFFUSE EMISSION BOX -->
<rect x="20" y="107" width="225" height="148" />
<text x="35" y="131" class="b">DIFFUSE EMISSION</text>
<text x="35" y="153">Vectorized [S, H, W, 3]</text>
<text x="35" y="173">• S=16 sample points</text>
<text x="35" y="193">• Physical 1 / r_k²</text>
<text x="35" y="213">• cos θ_e × cos θ_p</text>
<text x="35" y="233">• Radiometric norm</text>

<!-- 2. SHADOW / VISIBILITY BOX -->
<rect x="255" y="107" width="225" height="148" />
