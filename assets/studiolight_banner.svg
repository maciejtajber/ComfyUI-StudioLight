<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%">
  <defs>
    <!-- Pure White Enamel Engraving Gradient -->
    <linearGradient id="whiteEnamel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Hasselblad Lens Orange -->
    <linearGradient id="hasselbladOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ff6600" />
    </linearGradient>

    <!-- Mechanical Deboss Shadow -->
    <filter id="engravedMetal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- PURE MATTE BLACK BACKGROUND (NO BLUE, NO FRAME, TALLER 640PX CANVAS) -->
  <rect width="1920" height="640" fill="#000000" />

  <!-- PURE TYPOGRAPHY LOCKUP (CENTERED, NO LOGO) -->
  <g transform="translate(960, 270)" text-anchor="middle">
    
    <!-- 1. MAIN CAMERA WORDMARK: StudioLight -->
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="148" 
          font-weight="900" 
          fill="url(#whiteEnamel)" 
          letter-spacing="-3.5" 
          filter="url(#engravedMetal)">StudioLight</text>

    <!-- 2. TECHNICAL SPECIFICATION (Camera Engraving Typography) -->
    <text x="0" y="92" 
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" 
          font-size="19" 
          font-weight="700" 
          fill="#ffffff" 
          letter-spacing="5.5">
      PROFESSIONAL 3-POINT PHOTOMETRIC LIGHTING CONSOLE FOR FLUX
    </text>

    <!-- 3. CREATIVE AXIOM (Hasselblad Lens Orange) -->
    <text x="0" y="160" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" 
          font-size="28" 
          font-weight="700" 
          fill="url(#hasselbladOrange)" 
          letter-spacing="0.6">
      &quot;Stop prompt gambling. Design the light.&quot;
    </text>
  </g>
</svg>