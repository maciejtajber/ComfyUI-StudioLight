<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
    </style>

    <!-- Pure White Enamel Engraving Gradient -->
    <linearGradient id="whiteEnamel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>

    <!-- Hasselblad Lens Orange -->
    <linearGradient id="hasselbladOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ff6600" />
    </linearGradient>

    <!-- Mechanical Deboss Shadow -->
    <filter id="engravedMetal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- PURE MATTE BLACK BACKGROUND -->
  <rect width="1920" height="640" fill="#000000" />

  <!-- CENTERED CAMERA BRANDING LOCKUP -->
  <g transform="translate(960, 260)" text-anchor="middle">
    
    <!-- 1. MAIN CAMERA WORDMARK: StudioLight (Plus Jakarta Sans 900) -->
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="152" 
          font-weight="900" 
          fill="url(#whiteEnamel)" 
          letter-spacing="-4px" 
          filter="url(#engravedMetal)">StudioLight</text>

    <!-- 2. TECHNICAL SPECIFICATION (+10% bigger -> 21px) -->
    <text x="0" y="96" 
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" 
          font-size="21" 
          font-weight="700" 
          fill="#ffffff" 
          letter-spacing="5.5px">
      PROFESSIONAL 3-POINT PHOTOMETRIC LIGHTING CONSOLE FOR FLUX
    </text>

    <!-- 3. CREATIVE AXIOM (+10% bigger -> 31px, NO QUOTES/BRACKETS) -->
    <text x="0" y="166" 
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="31" 
          font-weight="700" 
          fill="url(#hasselbladOrange)" 
          letter-spacing="0.5px">
      Stop prompt gambling. Design the light.
    </text>
  </g>
</svg>