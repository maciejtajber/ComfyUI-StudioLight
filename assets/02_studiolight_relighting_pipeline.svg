<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="780" width="720" viewBox="0 0 720 780" class="aasvg">
<style>
.aasvg { color-scheme: light dark; --aasvg-b: light-dark(#1f2328, #e6edf3); --aasvg-w: light-dark(#ffffff, #0d1117); color: var(--aasvg-b, #1f2328); background-color: var(--aasvg-w, #ffffff); }
path, line, polyline, rect { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.dashed { stroke-dasharray: 4,4; }
text { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: currentColor; stroke: none; }
text.b { font-weight: 700; font-size: 13px; }
text.dim { font-size: 11px; opacity: 0.75; }
text.title { font-weight: 700; font-size: 14px; letter-spacing: 1px; }
text.accent { font-weight: 700; fill: #2ea44f; }
polygon.arrowhead { fill: currentColor; stroke: none; }
rect.box { stroke-width: 1.2; rx: 4; ry: 4; }
rect.box-accent { stroke-width: 1.5; stroke: #2ea44f; rx: 4; ry: 4; }
</style>

<!-- MAIN TITLE -->
<text x="360" y="32" class="title" text-anchor="middle">STUDIOLIGHT DUAL-INPUT PIPELINE</text>
<text x="360" y="50" class="dim" text-anchor="middle">Consistent V1 · Physical Layer Compositing</text>

<!-- 1. DUAL INGESTION -->
<rect x="50" y="80" width="280" height="48" class="box" />
<text x="190" y="100" class="b" text-anchor="middle">Existing 2D Photograph / Render</text>
<text x="190" y="116" class="dim" text-anchor="middle">Fixed source pixels (Zero prompt lottery)</text>

<rect x="390" y="80" width="280" height="48" class="box" />
<text x="530" y="100" class="b" text-anchor="middle">Optional Generated Draft</text>
<text x="530" y="116" class="dim" text-anchor="middle">Base latent plate from FLUX / SDXL</text>

<!-- Convergence lines to Source Plate -->
<path d="M 190,128 L 190,150 L 360,150" stroke-width="1.2"/>
<path d="M 530,128 L 530,150 L 360,150" stroke-width="1.2"/>
<path d="M 360,150 L 360,175" stroke-width="1.2"/>
<polygon class="arrowhead" points="360,181 356,171 364,171"/>

<!-- SOURCE PLATE -->
<rect x="230" y="182" width="260" height="38" class="box-accent" />
<text x="360" y="206" class="b" text-anchor="middle">Source Plate (Linear sRGB)</text>

<!-- Split into Analysis & Base Carrier -->
<path d="M 360,220 L 360,250" stroke-width="1.2"/>
<polygon class="arrowhead" points="360,256 356,246 364,246"/>

<!-- 2. SCENE ANALYSIS -->
<rect x="60" y="258" width="600" height="110" class="box" />
<text x="80" y="280" class="b">STRUCTURAL SCENE ANALYSIS</text>
<text x="80" y="304" class="dim">• Surface Normals: Marigold Normals / DSINE</text>
<text x="80" y="324" class="dim">• Relative Camera Depth: Depth Anything V2</text>
<text x="80" y="344" class="dim">• Subject Mask: BiRefNet-general (Subject Mask Isolator)</text>
<text x="370" y="304" class="dim">• Intrinsic Albedo: Marigold IID</text>
<text x="370" y="324" class="dim">• DeLight Controller: Linear diffuse blend</text>
<text x="370" y="344" class="dim">• Scene Intent: Prompt Sanitizer</text>

<!-- Down to Rig & Compositor -->
<path d="M 230,368 L 230,410" stroke-width="1.2"/>
<polygon class="arrowhead" points="230,416 226,406 234,406"/>

<path d="M 490,368 L 490,410" stroke-width="1.2"/>
<polygon class="arrowhead" points="490,416 486,406 494,406"/>

<!-- 3. STUDIO LIGHT RIG -->
<rect x="80" y="418" width="300" height="85" class="box" />
<text x="230" y="440" class="b" text-anchor="middle">StudioLight Rig Console</text>
<text x="100" y="462" class="dim">• 3D C-Stands: Azimuth, Elevation, Distance</text>
<text x="100" y="478" class="dim">• Modifiers: Octabox, Strip, Dish, Fresnel, Flash</text>
<text x="100" y="494" class="dim">• 3D Raymarching: P0 occlusion, IGN dither</text>

<!-- Telemetry Arrow to Compositor -->
<path d="M 380,460 L 440,460 L 440,535" stroke-width="1.2"/>
<polygon class="arrowhead" points="440,541 436,531 444,531"/>

<!-- Carrier Source line directly to Compositor -->
<path d="M 490,368 L 490,535" stroke-width="1.2"/>
<polygon class="arrowhead" points="490,541 486,531 494,531"/>

<!-- 4. CONSISTENT COMPOSITOR -->
<rect x="160" y="542" width="400" height="80" class="box-accent" />
<text x="360" y="566" class="b" text-anchor="middle">Consistent Compositor (Schema 1)</text>
<text x="360" y="586" class="dim" text-anchor="middle">Additive: HDR = Source · 2^e + Diffuse + Specular + Ambient</text>
<text x="360" y="604" class="dim" text-anchor="middle">Replacement: Subject mask + controlled source_preservation</text>

<!-- Dual Outputs -->
<path d="M 260,622 L 260,670" stroke-width="1.2"/>
<polygon class="arrowhead" points="260,676 256,666 264,666"/>

<path d="M 460,622 L 460,670" stroke-width="1.2"/>
<polygon class="arrowhead" points="460,676 456,666 464,666"/>

<!-- 5. OUTPUTS -->
<rect x="110" y="678" width="300" height="60" class="box-accent" />
<text x="260" y="702" class="b" text-anchor="middle">Direct Relit Proxy (~2s)</text>
<text x="260" y="722" class="accent" text-anchor="middle">✓ Instant Usable VFX Result</text>

<rect x="430" y="678" width="230" height="60" class="box" />
<text x="545" y="702" class="b" text-anchor="middle">Optional FLUX Refinement</text>
<text x="545" y="722" class="dim" text-anchor="middle">VAE Encode · Denoise 0.35–0.45</text>

</svg>
