<text x="50" y="458">• 3D C-Stands: Azimuth, Elevation, Dist</text>
<text x="50" y="478">• Modifiers: Octa, Strip, Dish, Flash</text>
<text x="50" y="498">• 3D Raymarching: P0 Occlusion, IGN</text>

