<!-- 1. DUAL INGESTION -->
<rect x="30" y="74" width="325" height="54" />
<text x="192" y="96" class="b" text-anchor="middle">Existing 2D Photograph / Render</text>
<text x="192" y="116" text-anchor="middle">Fixed pixels (Zero prompt drift)</text>

<rect x="380" y="74" width="325" height="54" />
<text x="542" y="96" class="b" text-anchor="middle">Optional Diffusion Draft</text>
<text x="542" y="116" text-anchor="middle">Base latent plate from FLUX / SDXL</text>

<!-- Bus to Source Plate -->
<path d="M 192,128 L 192,146 L 367,146" />
<path d="M 542,128 L 542,146 L 367,146" />
<path d="M 367,146 L 367,164" />
<polygon class="arrowhead" points="367,170 362,160 372,160" />

<!-- 2. SOURCE PLATE -->
<rect x="197" y="171" width="340" height="38" />
