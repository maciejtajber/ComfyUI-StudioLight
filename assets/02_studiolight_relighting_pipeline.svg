<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="725" width="735" viewBox="0 0 735 725" class="aasvg">
<style>
.aasvg { color-scheme: light dark; --aasvg-b: light-dark(#1f2328, #e6edf3); --aasvg-w: light-dark(#ffffff, #0d1117); color: var(--aasvg-b, #1f2328); }
path, line, polyline, rect { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.2; }
.dashed { stroke-dasharray: 3,6; }
text { font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: currentColor; stroke: none; }
text.b { font-weight: 700; }
text.title { font-weight: 700; font-size: 14px; }
text.sub { font-size: 11.5px; opacity: 0.85; }
polygon.arrowhead { fill: currentColor; stroke: none; }
rect { rx: 4; ry: 4; }
</style>

<!-- HEADER -->
<text x="367" y="32" class="title" text-anchor="middle">STUDIOLIGHT DUAL-INPUT PIPELINE</text>
<text x="367" y="49" class="sub" text-anchor="middle">[ Consistent V1 · Physical Layer Compositing ]</text>

<!-- 1. DUAL INGESTION -->
<rect x="40" y="72" width="290" height="52" />
<text x="185" y="93" class="b" text-anchor="middle">Existing 2D Photo / Render</text>
<text x="185" y="111" class="sub" text-anchor="middle">Fixed source pixels (Zero prompt drift)</text>

<rect x="405" y="72" width="290" height="52" />
<text x="550" y="93" class="b" text-anchor="middle">Optional Diffusion Draft</text>
<text x="550" y="111" class="sub" text-anchor="middle">Base latent plate from FLUX / SDXL</text>

<!-- Convergence lines to Source Plate -->
<path d="M 185,124 L 185,146 L 367,146" />
<path d="M 550,124 L 550,146 L 367,146" />
<path d="M 367,146 L 367,166" />
<polygon class="arrowhead" points="367,172 362,162 372,162" />

<!-- 2. SOURCE PLATE -->
<rect x="227" y="173" width="280" height="40" />
<text x="367" y="198" class="b" text-anchor="middle">Source Plate (Linear sRGB)</text>

<!-- Split into Analysis & Carrier -->
<path d="M 367,213 L 367,243" />
<polygon class="arrowhead" points="367,249 362,239 372,239" />

<!-- 3. SCENE ANALYSIS -->
<rect x="40" y="250" width="655" height="120" />
<text x="60" y="275" class="b">STRUCTURAL SCENE ANALYSIS</text>
<text x="470" y="275" class="sub">[ Extracted Upstream Once ]</text>

<!-- Column 1 -->
<text x="60" y="302">• Surface Normals: Marigold / DSINE</text>
<text x="60" y="324">• Camera Depth: Depth Anything V2</text>
<text x="60" y="346">• Subject Mask: BiRefNet-general</text>

<!-- Column 2 -->
<text x="390" y="302">• Intrinsic Albedo: Marigold IID</text>
<text x="390" y="324">• DeLight: Linear Diffuse Blend</text>
<text x="390" y="346">• Scene Intent: Prompt Sanitizer</text>

<!-- Down to Rig Console & Carrier bypass -->
<path d="M 210,370 L 210,413" />
<polygon class="arrowhead" points="210,419 205,409 215,409" />

<!-- Carrier Source bypass directly to Compositor -->
<path d="M 515,370 L 515,523" />
<polygon class="arrowhead" points="515,529 510,519 520,519" />

<!-- 4. STUDIO LIGHT RIG -->
<rect x="40" y="420" width="340" height="96" />
<text x="210" y="443" class="b" text-anchor="middle">StudioLight Rig Console</text>
<text x="60" y="465" class="sub">• 3D C-Stands: Azimuth, Elevation, Dist</text>
<text x="60" y="485" class="sub">• Modifiers: Octa, Strip, Dish, Flash</text>
<text x="60" y="505" class="sub">• 3D Raymarching: P0 Occlusion, IGN</text>

<!-- Rig to Compositor -->
<path d="M 380,468 L 435,468 L 435,523" />
<polygon class="arrowhead" points="435,529 430,519 440,519" />

<!-- 5. CONSISTENT COMPOSITOR -->
<rect x="92" y="530" width="550" height="78" />
<text x="367" y="554" class="b" text-anchor="middle">Consistent Compositor (Schema 1)</text>
<text x="367" y="574" class="sub" text-anchor="middle">Additive: HDR = Source · 2^e + Diffuse + Specular + Ambient</text>
<text x="367" y="593" class="sub" text-anchor="middle">Replacement: Subject Mask + Controlled Source Preservation</text>

<!-- Dual Outputs -->
<path d="M 230,608 L 230,642" />
<polygon class="arrowhead" points="230,648 225,638 235,638" />

<path d="M 505,608 L 505,642" />
<polygon class="arrowhead" points="505,648 500,638 510,638" />

<!-- 6. OUTPUTS -->
<rect x="65" y="649" width="330" height="54" />
<text x="230" y="671" class="b" text-anchor="middle">Direct Relit Proxy (~2s)</text>
<text x="230" y="690" class="sub" text-anchor="middle">Instant Physically Coherent VFX Plate</text>

<rect x="415" y="649" width="255" height="54" />
<text x="542" y="671" class="b" text-anchor="middle">Optional FLUX Polish</text>
