<text x="50" y="292">• Surface Normals: Marigold / DSINE</text>
<text x="50" y="316">• Relative Depth: Depth Anything V2</text>
<text x="50" y="340">• Subject Mask: BiRefNet-general</text>

<text x="385" y="292">• Intrinsic Albedo: Marigold IID</text>
<text x="385" y="316">• DeLight: Linear Diffuse Blend</text>
<text x="385" y="340">• Scene Intent: Prompt Sanitizer</text>

<!-- Split to Rig & Compositor -->
<path d="M 200,368 L 200,405" />
<polygon class="arrowhead" points="200,411 195,401 205,401" />

<path d="M 535,368 L 535,515" />
<polygon class="arrowhead" points="535,521 530,511 540,511" />

